name: Build 25.12.x x86-64
on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择luci版本"
        required: false
        default: "25.12.1"
        type: choice
        options:
          - 25.12.0
          - 25.12.1
      custom_router_ip:
        description: "请设置路由器的管理地址(仅对多网口路由器有效) 格式:192.168.x.1 或 10.x.x.1"
        required: true
        default: "192.168.100.1"
      profile:
        description: '选择软件包空间大小'
        required: true
        type: choice
        default: '1G'
        options:
          - '1G'
          - '2G'
          - '3G'
          - '4G'
      enable_store:
        description: "集成 store 商店"
        required: false
        type: boolean
        default: false
      po0_role:
        description: "PO0 角色"
        required: true
        type: choice
        default: "none"
        options:
          - "none"
          - "router-probe"
          - "gateway-reporter"
      po0_release_tag:
        description: "固定的 VPS-Toolkit PO0 Release tag"
        required: true
        default: "po0-v2026.08.30.5"
      po0_allowed_gateway_ip:
        description: "router-probe 允许调用探针的网关 IPv4"
        required: true
        default: "192.168.88.2"
      po0_router_ip:
        description: "gateway-reporter 查询的主路由 IPv4"
        required: true
        default: "192.168.88.1"
      include_docker:
        description: |
          是否编译 Docker 插件
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      enable_pppoe:
        description: "是否配置PPPoE拨号信息?"
        required: true
        default: 'no'
        type: choice
        options:
        - 'yes'
        - 'no'
      pppoe_account:
        description: "宽带账号 (若启用PPPoE)"
        required: false
      pppoe_password:
        description: "宽带密码 (若启用PPPoE)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set executable permissions
        run: chmod +x ${{ github.workspace }}/x86-64/build25.sh

      - name: Save Custom Router IP into OpenWrt files
        run: |
          mkdir -p "${{ github.workspace }}/custom"
          echo "${{ github.event.inputs.custom_router_ip }}" > "${{ github.workspace }}/custom/custom_router_ip.txt"
          echo "您设置的路由器管理地址是:${{ github.event.inputs.custom_router_ip }}"
          # 后续步骤会将该文件映射到路由器/etc/config/custom_router_ip.txt 以便用于开机脚本99-custom.sh读取用户设置的ip
      
      - name: Validate PPPoE Inputs
        run: |
          if [[ "${{ inputs.enable_pppoe }}" == "yes" ]]; then
            if [[ -z "${{ inputs.pppoe_account }}" || -z "${{ inputs.pppoe_password }}" ]]; then
              echo "Error: PPPoE account and password must be provided when PPPoE is enabled!"
              exit 1
            fi
          fi
      
      - name: Enable Store integration
        run: |
          if [ "${{ github.event.inputs.enable_store }}" == "true" ]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-store"' >> shell/apk-custom-packages.sh
            echo "✅ 已追加 luci-app-store"
          else
            echo "❎ 未启用 luci-app-store"
          fi

      - name: Prepare PO0 role package
        if: ${{ inputs.po0_role != 'none' }}
        shell: bash
        env:
          PO0_ROLE: ${{ inputs.po0_role }}
          PO0_RELEASE_TAG: ${{ inputs.po0_release_tag }}
          PO0_ALLOWED_GATEWAY_IP: ${{ inputs.po0_allowed_gateway_ip }}
          PO0_ROUTER_IP: ${{ inputs.po0_router_ip }}
        run: |
          set -euo pipefail
          [[ "${PO0_RELEASE_TAG}" =~ ^po0-v[0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+$ ]] || {
            echo "Invalid PO0 release tag: ${PO0_RELEASE_TAG}" >&2
            exit 1
          }
          valid_ipv4() {
            local ip="$1" octet
            [[ "${ip}" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || return 1
            IFS=. read -r -a octets <<< "${ip}"
            for octet in "${octets[@]}"; do
              (( 10#${octet} <= 255 )) || return 1
            done
          }
          valid_ipv4 "${PO0_ALLOWED_GATEWAY_IP}" || { echo "Invalid gateway IPv4" >&2; exit 1; }
          valid_ipv4 "${PO0_ROUTER_IP}" || { echo "Invalid router IPv4" >&2; exit 1; }

          case "${PO0_ROLE}" in
            router-probe) asset="po0-wan-probe.apk" ;;
            gateway-reporter) asset="po0-outbound-ip-report.apk" ;;
            *) echo "Unsupported PO0 role: ${PO0_ROLE}" >&2; exit 1 ;;
          esac
          release_base="https://github.com/SchweppesSoda/VPS-Toolkit/releases/download/${PO0_RELEASE_TAG}"
          mkdir -p po0-packages files/etc/uci-defaults
          curl -fL --retry 3 --connect-timeout 20 "${release_base}/${asset}" -o "po0-packages/${asset}"
          curl -fL --retry 3 --connect-timeout 20 "${release_base}/checksums.txt" -o po0-packages/checksums.txt
          (
            cd po0-packages
            grep -E "  ${asset}$" checksums.txt | sha256sum -c -
          )

          if [[ "${PO0_ROLE}" == "router-probe" ]]; then
            cat > files/etc/uci-defaults/95-po0-role <<EOF
          #!/bin/sh
          uci -q delete po0_wan_probe.main.allowed_source
          uci add_list po0_wan_probe.main.allowed_source='${PO0_ALLOWED_GATEWAY_IP}'
          uci set po0_wan_probe.main.enabled='1'
          uci commit po0_wan_probe
          exit 0
          EOF
          else
            cat > files/etc/uci-defaults/95-po0-role <<EOF
          #!/bin/sh
          uci set po0_outbound_ip_report.main.router_probe_url='http://${PO0_ROUTER_IP}/cgi-bin/po0-wan-probe'
          uci set po0_outbound_ip_report.main.wans='all'
          uci set po0_outbound_ip_report.main.enabled='0'
          uci commit po0_outbound_ip_report
          exit 0
          EOF
          fi
          chmod +x files/etc/uci-defaults/95-po0-role

      - name: Build ImmortalWrt-x86-64-efi 25.12.x
        run: |
          profile="${{ github.event.inputs.profile }}"
          case "$profile" in
            1G)
              ROOTFS_SIZE=1024
              ;;
            2G)
              ROOTFS_SIZE=2048
              ;;
            3G)
              ROOTFS_SIZE=3072
              ;;
            4G)
              ROOTFS_SIZE=4096
              ;;
          esac
          echo "ROOTFS_SIZE=$ROOTFS_SIZE" >> $GITHUB_ENV
          include_docker="${{ github.event.inputs.include_docker }}"
          luci_version="${{ github.event.inputs.luci_version }}"
          echo "Building for rootfs_size: $profile"
          docker run --rm -i \
            --user root \
            -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
            -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
            -v "${{ github.workspace }}/custom:/home/build/immortalwrt/files/etc/config" \
            -v "${{ github.workspace }}/x86-64/imm25.config:/home/build/immortalwrt/.config" \
            -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
            -v "${{ github.workspace }}/po0-packages:/home/build/immortalwrt/po0-packages" \
            -v "${{ github.workspace }}/x86-64/build25.sh:/home/build/immortalwrt/build.sh" \
            -e PROFILE=$ROOTFS_SIZE \
            -e INCLUDE_DOCKER=$include_docker \
            -e ENABLE_PPPOE=${{ inputs.enable_pppoe }} \
            -e PPPOE_ACCOUNT=${{ inputs.pppoe_account }} \
            -e PPPOE_PASSWORD=${{ inputs.pppoe_password }} \
            -e PO0_ROLE=${{ inputs.po0_role }} \
          immortalwrt/imagebuilder:x86-64-openwrt-${luci_version} /bin/bash /home/build/immortalwrt/build.sh
          

      - name: Create info
        run: |
          cat > ${{ github.workspace }}/router-info.md <<EOF
          ## 📡 路由器后台信息
          <a href="https://wkdaily.cpolar.cn/archives/1">
           <img src="https://img.shields.io/badge/若下载慢可套用国内加速站下载-FC7C0D?logo=github&logoColor=fff&labelColor=000&style=for-the-badge"/>
          </a>
          
          - 🏠 **后台地址**: ${{ github.event.inputs.custom_router_ip }}
          - 👤 **用户名**: root
          - 🔑 **密码**: 无
          EOF

          if [ "${{ github.event.inputs.include_docker }}" == "yes" ]; then
            extra_content="#### 默认带docker"
            echo -e "\n$extra_content" >> ${{ github.workspace }}/router-info.md
          else
            echo -e "\n#### 不带docker" >> ${{ github.workspace }}/router-info.md
          fi
          echo -e "\n#### PO0 角色: ${{ inputs.po0_role }}" >> ${{ github.workspace }}/router-info.md
          if [ "${{ inputs.po0_role }}" != "none" ]; then
            echo "#### PO0 Release: ${{ inputs.po0_release_tag }}" >> ${{ github.workspace }}/router-info.md
          fi

      - name: Mark image with PO0 role
        shell: bash
        env:
          PO0_ROLE: ${{ inputs.po0_role }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for image in "${{ github.workspace }}"/bin/targets/x86/64/*squashfs-combined-efi.img.gz; do
            mv "${image}" "${image%.img.gz}-po0-${PO0_ROLE}.img.gz"
          done

      - name: Upload ImmortWrt as release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Autobuild-x86-64
          body_path: ${{ github.workspace }}/router-info.md
          files: |
            ${{ github.workspace }}/bin/targets/x86/64/*squashfs-combined-efi-po0-*.img.gz
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
